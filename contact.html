<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="stamp-logo">
      <span class="badge">桌子</span>
      <span>
        <span class="word">tablelization</span>
        <span class="sub">插畫 · 手作 · 設計· 游水zine</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="主導覽">
      <ul>
        <li><a href="index.html">首頁</a></li>
        <li><a href="portfolio.html">作品集</a></li>
        <li><a href="eggzine.html">蛋誌</a></li>

        <li><a href="contact.html" aria-current="page">聯絡</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding-bottom:20px;">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <h1>說聲哈囉</h1>
      <p class="tagline">合作邀約、訂製詢問，或只是想聊聊手作的事，都歡迎透過以下方式找我。</p>
    </div>
  </section>

  <div class="stitch-divider" role="presentation"></div>

  <section class="section">
    <div class="wrap contact-grid">

      <!-- 將 mailto 換成你的實際電郵地址 -->
      <a class="contact-card reveal" href="mailto:hello@tablelization.com">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <p class="label">Email</p>
        <p class="value">寫封信</p>
      </a>

      <!-- 將連結換成你的 Instagram 帳號網址 -->
      <a class="contact-card reveal" href="https://www.instagram.com/tableblublublu" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        <p class="label">Instagram</p>
        <p class="value">日常更新</p>
      </a>

      <!-- 將連結換成你的 YouTube 頻道網址 -->
      <a class="contact-card reveal" href="https://www.youtube.com/" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M10.5 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
        <p class="label">YouTube</p>
        <p class="value">製作花絮</p>
      </a>

      <!-- 如需 WhatsApp，將 852XXXXXXXX 換成你的號碼 -->
      <a class="contact-card reveal" href="https://wa.me/852XXXXXXXX" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l1.4-4.2A8 8 0 1112 20a7.9 7.9 0 01-4-1.1z"/></svg>
        <p class="label">WhatsApp</p>
        <p class="value">直接傳訊</p>
      </a>

    </div>
  </section>
</main>

<footer class="site-footer">

      <a href="https://www.youtube.com/tablelization" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
</footer>
